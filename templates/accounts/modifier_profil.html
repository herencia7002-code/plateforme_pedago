{% extends "accounts/base_user.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            Modifier mon profil
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary">
                    <i class="bi bi-check-circle"></i>
                    Enregistrer
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
