{% extends "dashboard/base_dashboard.html" %}
{% block title %}Mot de passe modifié{% endblock %}
{% block page_title %}Sécurité{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card border-0 shadow-sm rounded-4 mx-auto text-center p-4" style="max-width: 500px;">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
        <h4 class="mt-3">Mot de passe modifié avec succès</h4>
        <p class="text-muted">Votre mot de passe administrateur a bien été mis à jour.</p>
        <a href="{% url 'parametres_generaux' %}" class="btn btn-primary mt-2">
            Retour aux paramètres
        </a>
    </div>
</div>
{% endblock %}
